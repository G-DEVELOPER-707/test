<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Onlayn test</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#16202e;--mute:#5d6b7e;--line:#d8dee8;--acc:#1f5fd1;--accbg:#e4edfc;--ok:#13795b;--okbg:#dff4ec;--bad:#b3261e;--badbg:#fbe5e3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141c;--card:#18202c;--ink:#e8edf5;--mute:#98a5b8;--line:#2b3646;--acc:#6b9cf5;--accbg:#1c2d4d;--ok:#4cc79e;--okbg:#14352b;--bad:#ff8b82;--badbg:#3d1d1b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f141c;--card:#18202c;--ink:#e8edf5;--mute:#98a5b8;--line:#2b3646;--acc:#6b9cf5;--accbg:#1c2d4d;--ok:#4cc79e;--okbg:#14352b;--bad:#ff8b82;--badbg:#3d1d1b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.top{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.top h1{margin:0;font-size:1.2rem;line-height:1.3}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:.9rem;margin-top:6px}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .2s}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.qn{color:var(--mute);font-size:.9rem;margin-bottom:6px}
.q{font-size:1.1rem;font-weight:600;margin:0 0 14px;white-space:pre-wrap}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--acc)}
.opt b{min-width:1.4em;color:var(--mute)}
.opt.sel{border-color:var(--acc);background:var(--accbg)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:focus-visible,.btn:focus-visible,.g:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:8px;justify-content:space-between;margin-top:12px}
.btn{font:inherit;font-weight:600;padding:11px 18px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.p{color:#0b1220}}
.btn:disabled{opacity:.45;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin-top:14px}
.g{font:inherit;padding:8px 0;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.g.done{background:var(--accbg);border-color:var(--acc)}
.g.cur{outline:2px solid var(--ink);outline-offset:1px}
.g.ok{background:var(--okbg);border-color:var(--ok)}
.g.bad{background:var(--badbg);border-color:var(--bad)}
.score{text-align:center;padding:10px 0 6px}
.score .n{font-size:3rem;font-weight:700;line-height:1.1}
.score p{margin:4px 0;color:var(--mute)}
.rv{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
.hidden{display:none}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dlg{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:18px;max-width:380px;width:100%}
.dlg p{margin:0 0 6px}
.intro p{margin:0 0 12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1 id="subject"></h1>
    <div class="meta"><span id="prog"></span><span id="timer">00:00</span></div>
    <div class="bar"><i id="bar"></i></div>
  </div>
  <div class="card" id="main"></div>
  <div class="grid" id="grid"></div>
  <div class="row" id="foot"></div>
</div>

<script src="savollar.js"></script>
<script>
const L=["A","B","C","D"];
const $=id=>document.getElementById(id);
let items,ans,cur,done,t0,tm,adv;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function size(){return Math.min(DATA.testSize||25,DATA.questions.length)}

function intro(){
  clearInterval(tm);clearTimeout(adv);
  const r=$("res");if(r)r.remove();
  document.title=DATA.subject;
  $("subject").textContent=DATA.subject;
  $("prog").textContent=size()+" ta savol";$("bar").style.width="0";$("timer").textContent="";
  $("grid").innerHTML="";$("foot").innerHTML="";
  $("main").innerHTML='<div class="intro"><p class="q">'+size()+' ta savoldan iborat test</p><p>Har bir savolda 4 ta variant bor. Variantni belgilasangiz, keyingi savolga o‘tiladi. Tekshirishdan oldin istalgan savolga qaytib, javobni o‘zgartirishingiz mumkin.</p><button class="btn p" id="go">Testni boshlash</button></div>';
  $("go").onclick=start;
}

function start(){
  const r=$("res");if(r)r.remove();
  const n=size();
  items=shuffle(DATA.questions).slice(0,n).map(x=>({
    q:x.q,
    opts:shuffle(x.options.map((t,i)=>({t,c:i===x.answer})))
  }));
  ans=new Array(n).fill(null);cur=0;done=false;t0=Date.now();
  clearInterval(tm);clearTimeout(adv);
  $("timer").textContent="00:00";
  tm=setInterval(()=>{$("timer").textContent=fmt(Math.floor((Date.now()-t0)/1000))},1000);
  render();
}

function render(){
  const n=items.length,a=ans.filter(v=>v!==null).length;
  $("prog").textContent=done?"Natija":"Javob berilgan: "+a+" / "+n;
  $("bar").style.width=(done?100:a/n*100)+"%";
  $("grid").innerHTML=items.map((it,i)=>{
    let c="g";
    if(done)c+=(ans[i]!==null&&it.opts[ans[i]].c)?" ok":" bad";
    else if(ans[i]!==null)c+=" done";
    if(i===cur)c+=" cur";
    return '<button class="'+c+'" data-i="'+i+'" aria-label="'+(i+1)+'-savol">'+(i+1)+'</button>'}).join("");
  $("grid").querySelectorAll(".g").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;render();window.scrollTo({top:0,behavior:"smooth"})});
  const it=items[cur];
  let html='<div class="qn">'+(cur+1)+'-savol, jami '+n+' ta</div><p class="q"></p>';
  it.opts.forEach((o,i)=>{
    let c="opt";
    if(done){if(o.c)c+=" ok";else if(ans[cur]===i)c+=" bad"}
    else if(ans[cur]===i)c+=" sel";
    html+='<button class="'+c+'" data-o="'+i+'"'+(done?" disabled":"")+'><b>'+L[i]+'.</b><span class="t"></span></button>'});
  if(done){
    const r=ans[cur]===null?"Javob berilmagan":(it.opts[ans[cur]].c?"To‘g‘ri":"Noto‘g‘ri");
    html+='<p style="margin:8px 0 0;color:var(--mute)">'+r+'</p>'}
  $("main").innerHTML=html;
  $("main").querySelector(".q").textContent=it.q;
  $("main").querySelectorAll(".opt").forEach((b,i)=>{
    b.querySelector(".t").textContent=it.opts[i].t;
    b.onclick=()=>{
      if(done)return;
      ans[cur]=i;render();
      const at=cur;clearTimeout(adv);
      adv=setTimeout(()=>{if(!done&&cur===at&&cur<n-1){cur++;render()}},300);
    }});
  $("foot").innerHTML='<button class="btn" id="pv"'+(cur===0?" disabled":"")+'>Oldingi</button>'+
    (done?'<button class="btn p" id="rs">Qaytadan boshlash</button>':'<button class="btn p" id="fin">Tekshirish</button>')+
    '<button class="btn" id="nx"'+(cur===n-1?" disabled":"")+'>Keyingi</button>';
  $("pv").onclick=()=>{clearTimeout(adv);cur--;render()};
  $("nx").onclick=()=>{clearTimeout(adv);cur++;render()};
  if(done)$("rs").onclick=start;
  else $("fin").onclick=finish;
}

function ask(msg,okText,cb){
  const d=document.createElement("div");d.className="ov";
  d.innerHTML='<div class="dlg" role="dialog" aria-modal="true"><p></p><div class="row"><button class="btn" id="no">Qaytish</button><button class="btn p" id="yes"></button></div></div>';
  d.querySelector("p").textContent=msg;
  d.querySelector("#yes").textContent=okText;
  document.body.appendChild(d);
  d.querySelector("#no").onclick=()=>d.remove();
  d.querySelector("#yes").onclick=()=>{d.remove();cb()};
  d.querySelector("#yes").focus();
}

function finish(){
  clearTimeout(adv);
  const un=ans.filter(v=>v===null).length;
  const msg=un?un+" ta savolga javob berilmagan. Baribir tekshirasizmi?":"Testni yakunlaysizmi? Keyin javoblarni o‘zgartirib bo‘lmaydi.";
  ask(msg,"Tekshirish",doFinish);
}

function doFinish(){
  const n=items.length;
  done=true;clearInterval(tm);
  const ok=items.filter((it,i)=>ans[i]!==null&&it.opts[ans[i]].c).length;
  const pct=Math.round(ok/n*100);
  const sec=Math.floor((Date.now()-t0)/1000);
  $("main").insertAdjacentHTML("beforebegin",
   '<div class="card" id="res" style="margin-bottom:12px"><div class="score"><div class="n">'+ok+' / '+n+'</div><p>To‘g‘ri javoblar: '+pct+'%</p><p>Noto‘g‘ri yoki javobsiz: '+(n-ok)+' ta · Vaqt: '+fmt(sec)+'</p><p>Quyidagi raqamlarni bosib har bir savolni ko‘rib chiqing.</p></div></div>');
  cur=0;render();window.scrollTo({top:0,behavior:"smooth"});
}
intro();
</script>
</body>
</html>
